name: Deploy Hypothesis Engine (Testing)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hypothesis-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hetzner Server via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_SSH_IP }}
          username: ${{ secrets.HETZNER_SSH_USERNAME }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          script: |
            set -euo pipefail
            COMMIT_SHA=${{ github.sha }}
            echo "🚀 Deploying Hypothesis Engine (commit: ${COMMIT_SHA:0:7})..."

            cd /home/cicd/hypothesis-generation
            git fetch --no-tags origin
            git checkout "$COMMIT_SHA" -f

            # Ensure host logs directory exists and is writable by container appuser (UID 1000)
            mkdir -p logs && chmod 777 logs

            echo "🐳 Building and starting container..."
            CONTAINER_NAME=hypothesis-generation \
            ENVIRONMENT=demo \
            APP_PORT=8501 \
              docker compose -p hypothesis-generation up -d --build

            echo "🩺 Waiting for health check..."
            sleep 5
            docker inspect --format='{{json .State.Health.Status}}' hypothesis-generation || true

            echo "✅ Hypothesis Engine deployed successfully"
